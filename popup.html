<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" width="22" height="22" alt="">
    <h1>Tab Organiser</h1>
    <span id="ai-status" class="status" title="Local AI status"></span>
    <button id="open-panel" class="icon-head" title="Open the notes side panel: highlight with the pen, write notes"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="6" width="6" height="12" rx="1" fill="currentColor"/></svg></button>
    <button id="open-library" class="lib-btn" title="Open the Library">Library ↗</button>
  </header>

  <!-- shown when this tab is a source of a project: sort it, then read the next one -->
  <section id="src-card" class="srccard" hidden>
    <div class="src-top"><span class="small muted">Reading for</span> <b id="src-proj"></b><span id="src-prog" class="small muted"></span></div>
    <div class="src-btns">
      <button data-st="useful" class="sbtn ok">✓ Useful</button>
      <button data-st="later" class="sbtn">Later</button>
      <button data-st="skip" class="sbtn no">✕ Not needed</button>
    </div>
    <div id="prune" class="prune" hidden>
      <span class="small"></span>
      <button id="prune-one" class="sbtn">Only this</button>
      <button id="prune-all" class="sbtn no">This + those</button>
    </div>
    <input id="src-note" class="input" placeholder="Note: why it matters (optional)">
    <div class="src-bottom">
      <label class="small check"><input id="src-auto" type="checkbox" checked> then open the next one here</label>
      <button id="src-next" class="btn">Next ▶</button>
    </div>
  </section>

  <!-- this page: one big Save; ▾ picks where, the bell picks a reminder -->
  <section class="page">
    <div class="current">
      <img id="cur-fav" alt="">
      <div class="cur-text">
        <div id="cur-title" class="cur-title">…</div>
        <div id="cur-where" class="muted small"></div>
      </div>
      <button id="pin-cur" class="star" title="Pin to Library">☆</button>
    </div>

    <div class="go">
      <div class="split menu-wrap" id="split">
        <button id="save" class="btn primary">Save to Inbox</button>
        <button id="dest-btn" class="btn primary caret" title="Save somewhere else" aria-haspopup="menu" aria-label="Save somewhere else"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div id="dest" class="menu left" role="menu" hidden>
          <span class="menu-label">Save to</span>
          <button data-dest="inbox" role="menuitemradio">Inbox</button>
          <button data-dest="collection" role="menuitemradio">Collection…</button>
          <button data-dest="project" role="menuitemradio">Project…</button>
        </div>
      </div>
      <div class="bell-wrap menu-wrap">
        <button id="bell" class="square" title="Remind me…" aria-haspopup="menu" aria-label="Remind me"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v3.2L4.5 15a1 1 0 0 0 .9 1.5h13.2a1 1 0 0 0 .9-1.5L18 12.2V9a6 6 0 0 0-6-6Zm-2.2 15a2.3 2.3 0 0 0 4.4 0Z" fill="currentColor"/></svg></button>
        <div id="bell-menu" class="menu" role="menu" hidden></div>
      </div>
    </div>

    <div class="dest-body" data-for="collection" hidden>
      <input id="col-input" class="input" list="paths" placeholder="Collection, e.g. AI › Agents › Papers" spellcheck="false">
      <datalist id="paths"></datalist>
    </div>
    <div class="dest-body" data-for="project" hidden>
      <select id="ws-select"></select>
      <input id="ws-new" class="input" placeholder="New project name" hidden>
    </div>
  </section>

  <!-- this window: one AI action, the rest behind ⋯ -->
  <section class="win">
    <div class="sec-head"><h2>This window</h2><span id="summary" class="muted small"></span></div>
    <div class="tools">
      <button id="organise" class="btn dark"><span class="spark">✦</span> Organise with AI</button>
      <button id="dedupe" class="btn quiet" hidden></button>
      <div class="menu-wrap">
        <button id="more" class="square" title="More window tools" aria-haspopup="menu" aria-label="More window tools"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm8 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm8 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z" fill="currentColor"/></svg></button>
        <div id="more-menu" class="menu up" role="menu" hidden>
          <button id="all-inbox" title="Save every tab of this window to the Inbox and close them">All tabs → Inbox</button>
          <button id="park" title="Save all tabs as a project's sources, then read them slowly">Park this window…</button>
          <button id="track" title="New pages you open in this window join the project's trail">Track for a project…</button>
          <button id="save-session" title="Temporary, kept 30 days">Save session</button>
          <button id="ungroup">Ungroup tabs</button>
        </div>
      </div>
    </div>
    <div id="working-row" class="working" title="New pages you open in this window join the project's trail" hidden>
      <span class="small muted">Working on</span>
      <select id="working"></select>
      <input id="working-new" class="input" placeholder="New project name, Enter" hidden>
    </div>
    <form id="park-form" class="park-form" hidden>
      <select id="park-proj"></select>
      <input id="park-name" class="input" placeholder="New project name">
      <div class="park-go">
        <label class="small check"><input id="park-close" type="checkbox" checked> close the tabs</label>
        <button class="btn primary">Park</button>
      </div>
    </form>
    <div id="ws" class="ws"></div>
  </section>

  <p id="msg" class="msg small muted"></p>

  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
