<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <img id="fav" alt="">
    <div class="head-text">
      <div id="title" class="title">…</div>
      <div id="where" class="muted small"></div>
    </div>
  </header>

  <div class="bar">
    <button id="hl-btn" class="btn primary" title="Select text on the page first">✎ Highlight selection</button>
    <button id="show-btn" class="btn" title="Mark your highlights in the page">Show on page</button>
  </div>
  <div class="colors" id="colors" title="Colour for new highlights"></div>

  <section>
    <div class="sec-head"><h2>Highlights</h2><span id="hl-count" class="muted small"></span></div>
    <div id="hl-list"></div>
  </section>

  <section>
    <div class="sec-head"><h2>Summary <span class="ai-tag">AI</span></h2><span id="sum-meta" class="muted small"></span></div>
    <div id="sum-box"></div>
    <div class="sum-btns">
      <button id="sum-hl" class="btn" title="Key ideas from your highlights and notes">✦ Key ideas from my highlights</button>
      <button id="sum-page" class="btn" title="A short summary of the whole page">✦ Summarise the page</button>
    </div>
  </section>

  <section>
    <div class="sec-head"><h2>My notes</h2><span id="saved" class="muted small"></span></div>
    <textarea id="text" placeholder="Your thoughts, a summary, questions… (saved as you type, linked to this page)"></textarea>
  </section>

  <section class="actions">
    <div class="sec-head"><h2>This page</h2></div>
    <div class="row">
      <button id="save-inbox" class="btn">Save to Inbox</button>
      <button id="export" class="btn" title="Download .md and copy to clipboard">Export</button>
      <button id="library" class="btn">Library ↗</button>
    </div>
    <label class="small check"><input id="auto" type="checkbox"> Always show highlights on pages I've annotated</label>
    <p id="msg" class="small muted"></p>
  </section>

  <script src="core.js"></script>
  <script src="panel.js"></script>
</body>
</html>
