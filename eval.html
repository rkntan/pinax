<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pinax accuracy check</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { max-width: 900px; margin: 24px auto; padding: 0 16px; font: 14px/1.5 Inter, system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .bar { display: flex; gap: 12px; align-items: center; margin: 14px 0; flex-wrap: wrap; }
    button { cursor: pointer; padding: 6px 14px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #8884; vertical-align: top; }
    .ok { color: #1a7f37; } .no { color: #c4271c; } .muted { opacity: .65; }
    .big { font-size: 28px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Accuracy check</h1>
  <p class="muted">Runs the local AI over labelled sample pages and scores the two-step filing.</p>
  <div class="bar">
    <button id="run">Run check</button>
    <label><input id="corr" type="checkbox"> use my saved filings as examples</label>
    <span id="status" class="muted"></span>
  </div>
  <div id="score"></div>
  <div id="out"></div>
  <script src="taxonomy.js"></script>
  <script src="core.js"></script>
  <script src="eval-samples.js"></script>
  <script src="eval.js"></script>
</body>
</html>
